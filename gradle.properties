# Overridden locally for an 8GB RAM machine — 4096m needed for R8 whole-program release minification
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
org.gradle.configureondemand=true
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.daemon=false

android.enableAdditionalTestOutput=true
libLicense=MPL-2.0
libLicenseUrl=https://www.mozilla.org/en-US/MPL/2.0/
android.enableR8.fullMode=false
android.experimental.enableTestFixturesKotlinSupport=true

# Limit the memory of the Kotlin compiler process
kotlin.daemon.jvmopts=-Xmx2560m -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m

# Lowered for 8GB RAM machine (upstream recommends 4 for 16GB machines)
org.gradle.workers.max=1
